<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prachee Mahapatra</title>
  <meta name="description" content="">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2359B5D2'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' text-anchor='middle' fill='%230D0E11'%3EPM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Nunito:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <nav class="wrap nav__inner" aria-label="Primary">
      <a href="#top" class="brand"><span class="brand__mark" data-bind="initials">PM</span><span class="brand__name" data-bind="name">Prachee Mahapatra</span></a>
      <div class="nav__links">
        <a href="#work">Work</a>
        <a href="#experience">Experience</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch theme">
          <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <main id="top" class="wrap">
    <section class="hero" aria-labelledby="hero-name">
      <div class="hero__main rise">
        <div class="hero__head">
          <h1 id="hero-name" class="hero__name" data-bind="name"></h1>
          <p class="hero__intro" data-bind="hero.intro"></p>
        </div>
        <p class="hero__role" aria-live="polite"><span data-bind="hero.rolePrefix"></span> <span class="accent-text" id="role"></span><span class="caret"></span></p>
        <div class="row">
          <a href="#work" class="btn btn--accent">See selected work
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg></a>
          <button type="button" class="btn btn--ghost js-copy">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            <span class="js-copy-label" data-default="Copy email">Copy email</span></button>
        </div>
      </div>
      <aside class="now rise" aria-label="Currently">
        <div class="eyebrow"><span class="pulse"></span>Right now</div>
        <div id="now"></div>
      </aside>
    </section>

    <section class="stats rise" aria-label="At a glance" id="stats"></section>

    <section id="work" class="section" aria-labelledby="work-h">
      <div class="section__head">
        <div><span class="kicker">01 — Work</span><h2 id="work-h">Selected projects</h2></div>
        <div class="pills" role="group" aria-label="Filter projects" id="filters"></div>
      </div>
      <div class="projects" id="projects"></div>
    </section>

    <section id="experience" class="section" aria-labelledby="exp-h">
      <div class="section__head"><div><span class="kicker">02 — Experience</span><h2 id="exp-h">Where I’ve worked</h2></div></div>
      <div class="exp">
        <div class="exp__tabs" role="tablist" aria-label="Roles" id="exp-tabs"></div>
        <div class="exp__panel card" role="tabpanel" id="exp-panel"></div>
      </div>
    </section>

    <section id="skills" class="section" aria-labelledby="skills-h">
      <div class="section__head"><div><span class="kicker">03 — Toolkit</span><h2 id="skills-h">Skills &amp; foundations</h2></div></div>
      <div class="skills" id="skills-list"></div>
      <div class="two-col">
        <div class="card lift"><span class="eyebrow">Education</span><div id="education"></div></div>
        <div class="card lift"><span class="eyebrow">Leadership &amp; certifications</span><ul class="list" id="leadership"></ul></div>
      </div>
    </section>

    <section id="contact" class="section contact-wrap" aria-labelledby="contact-h">
      <div class="contact">
        <span class="kicker kicker--ink">04 — Contact</span>
        <h2 id="contact-h" data-bind="contact.heading"></h2>
        <p data-bind="contact.text"></p>
        <div class="row" id="contact-links">
          <button type="button" class="btn btn--ink js-copy">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <span class="js-copy-label" data-default="">email</span></button>
        </div>
      </div>
      <footer class="footer"><span id="copyright"></span><span data-bind="footerNote"></span></footer>
    </section>
  </main>

  <noscript><p class="wrap">This site needs JavaScript to load its content.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
